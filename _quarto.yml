project:
  type: website
  render:
    - "*.qmd"
    - "posts"
  resources:
    - favicon.ico
    - favicon.svg
    - apple-touch-icon.png

website:
  google-analytics: G-8BJ08S4YXX
  title: "elanderos"
  site-url: https://e-landeros.github.io
  description: "Notes on AI, data, and things I build. By Fabian Landeros."
  favicon: favicon.png
  image: profile.jpeg
  open-graph: true
  twitter-card: true
  search: true
  navbar:
    left:
      - text: "Writing"
        href: /index.html#recent-writing
      - text: "About"
        href: /about.html
    right:
      - icon: github
        href: https://github.com/e-landeros
      - icon: twitter-x
        href: https://x.com/e_landeros_
      - icon: linkedin
        href: https://www.linkedin.com/in/e_landeros_
      - icon: graph-up
        href: https://www.kaggle.com/elanderos
      - icon: rss
        href: /index.xml
  back-to-top-navigation: true
  page-footer:
    background: dark
    right: "Made with [Quarto](https://quarto.org/) © 2023 Fabian Landeros"
    left:
      - icon: github
        href: https://github.com/e-landeros
      - icon: twitter-x
        href: https://x.com/e_landeros_
      - icon: linkedin
        href: https://www.linkedin.com/in/e_landeros_
      - icon: graph-up
        href: https://www.kaggle.com/elanderos

format:
  html:
    theme:
      - darkly
      - theme/catppuccin-mocha.scss
    css: styles.css
    page-layout: full
    include-in-header: theme/head.html
    code-block-bg: true
    code-block-border-left: "#cba6f7"

syntax-highlighting: theme/catppuccin-mocha.theme
